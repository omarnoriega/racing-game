apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: racing-game-backend-hpa
  namespace: racing-game
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: racing-game-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: racing-game-frontend-hpa
  namespace: racing-game
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: racing-game-frontend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70