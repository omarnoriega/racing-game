apiVersion: apps/v1
kind: Deployment
metadata:
  name: racing-game-frontend
  namespace: default
  labels:
    app: racing-game-frontend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: racing-game-frontend
  template:
    metadata:
      labels:
        app: racing-game-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: <ACR_NAME>.azurecr.io/racing-game-frontend:latest  # TODO: Reemplazar ACR_NAME
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: racing-game-frontend
  namespace: default
  labels:
    app: racing-game-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: racing-game-frontend