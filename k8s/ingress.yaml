apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: racing-game-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # WebSocket support
    nginx.ingress.kubernetes.io/websocket-services: "racing-game-backend"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - racing-game.example.com  # TODO: Tu dominio
    - api.racing-game.example.com  # TODO: Tu dominio
    secretName: racing-game-tls
  rules:
  - host: racing-game.example.com  # TODO: Tu dominio (frontend)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: racing-game-frontend
            port:
              number: 80
  - host: api.racing-game.example.com  # TODO: Tu dominio (backend)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: racing-game-backend
            port:
              number: 3001