apiVersion: apps/v1
kind: Deployment
metadata:
  name: racing-game-backend
  namespace: racing-game
  labels:
    app: racing-game-backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: racing-game-backend
  template:
    metadata:
      labels:
        app: racing-game-backend
        version: v1
    spec:
      containers:
      - name: backend
        image: <ACR_NAME>.azurecr.io/racing-game-backend:latest  # TODO: Reemplazar ACR_NAME
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: racing-game-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: racing-game-config
              key: PORT
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: racing-game-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: racing-game-secrets
              key: jwt-secret
        - name: CORS_ORIGIN
          value: "*"  # Se actualiza con el dominio real
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: racing-game-backend
  namespace: racing-game
  labels:
    app: racing-game-backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: racing-game-backend