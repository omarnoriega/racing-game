trigger:
  branches:
    include:
      - main
      - feature/canary
      - canary

variables:
  - name: acrName
    value: 'racinggamecr'  
  - name: resourceGroup
    value: 'racing-game-rg'
  - name: appName
    value: 'racing-game-frontend'
  - name: azureSubscription
    value: 'Azure-Racing-Game'  
  - group: 'racing-game-config'
  - name: keepRevisions
    value: 2
  - name: backendApp
    value: 'racing-game-backend'
  - name: frontendApp
    value: 'racing-game-frontend'

stages:
  # Stage 1: Limpieza Pre-Deploy
  - stage: PreCleanup
    displayName: 'Pre-Deploy Cleanup'
    jobs:
        - job: CleanupOldRevisions
          displayName: 'Cleanup Old Revisions'
          pool:
            vmImage: 'ubuntu-latest'
          steps:
            - task: AzureCLI@2
              displayName: 'Cleanup Backend Revisions'
              inputs:
                azureSubscription: '$(azureSubscription)'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  echo "🧹 Cleaning up old backend revisions..."
                  
                  # Obtener revisiones (ordenadas, más reciente primero)
                  REVISIONS=$(az containerapp revision list \
                    --name $(backendApp) \
                    --resource-group $(resourceGroup) \
                    --query "sort_by([].{name:name, created:properties.createdTime}, &created) | reverse(@) | [].name" \
                    --output tsv)
                  
                  # Contar revisiones
                  TOTAL=$(echo "$REVISIONS" | wc -l)
                  echo "Total revisions: $TOTAL"
                  
                  # Si hay más revisiones que las que queremos mantener
                  if [ $TOTAL -gt $(keepRevisions) ]; then
                    # Obtener revisiones a eliminar (todas excepto las últimas N)
                    TO_DELETE=$(echo "$REVISIONS" | tail -n +$(($(keepRevisions) + 1)))
                    
                    for REV in $TO_DELETE; do
                      echo "Deactivating: $REV"
                      az containerapp revision deactivate \
                        --name $(backendApp) \
                        --resource-group $(resourceGroup) \
                        --revision $REV \
                        --output none || true
                    done
                    
                    echo "✅ Cleanup completed"
                  else
                    echo "✅ No cleanup needed"
                  fi

            - task: AzureCLI@2
              displayName: 'Cleanup Frontend Revisions'
              inputs:
                azureSubscription: '$(azureSubscription)'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  echo "🧹 Cleaning up old frontend revisions..."
                  
                  REVISIONS=$(az containerapp revision list \
                    --name $(frontendApp) \
                    --resource-group $(resourceGroup) \
                    --query "sort_by([].{name:name, created:properties.createdTime}, &created) | reverse(@) | [].name" \
                    --output tsv)
                  
                  TOTAL=$(echo "$REVISIONS" | wc -l)
                  echo "Total revisions: $TOTAL"
                  
                  if [ $TOTAL -gt $(keepRevisions) ]; then
                    TO_DELETE=$(echo "$REVISIONS" | tail -n +$(($(keepRevisions) + 1)))
                    
                    for REV in $TO_DELETE; do
                      echo "Deactivating: $REV"
                      az containerapp revision deactivate \
                        --name $(frontendApp) \
                        --resource-group $(resourceGroup) \
                        --revision $REV \
                        --output none || true
                    done
                    
                    echo "✅ Cleanup completed"
                  else
                    echo "✅ No cleanup needed"
                  fi

  - stage: BuildVersions
    displayName: 'Build Both Versions'
    jobs:
      - job: BuildBackend
        displayName: 'Build Backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: '$(acrName)'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              repository: racing-game-backend
              dockerfile: 'server/Dockerfile'
              containerRegistry: '$(acrName)'
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push Backend Image'
            inputs:
              command: push
              repository: racing-game-backend
              containerRegistry: '$(acrName)'
              tags: |
                $(Build.BuildId)
                latest

      - job: BuildTap
        displayName: 'Build TAP Version'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            clean: true
          - task: Docker@2
            displayName: 'Build TAP Image'
            inputs:
              command: build
              repository: racing-game-frontend
              dockerfile: 'client/Dockerfile'
              containerRegistry: '$(acrName)'
              arguments: |
                --build-arg REACT_APP_API_URL=$(REACT_APP_API_URL)
                --build-arg REACT_APP_WS_URL=$(REACT_APP_WS_URL)
              tags: |
                tap-canary-$(Build.BuildId)
                tap-canary-latest
          - task: Docker@2
            displayName: 'Push TAP Image'
            inputs:
              command: push
              repository: racing-game-frontend
              containerRegistry: '$(acrName)'
              tags: |
                tap-canary-$(Build.BuildId)
                tap-canary-latest

      - job: BuildMotion
        displayName: 'Build MOTION Version'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Build MOTION Image'
            inputs:
              command: build
              repository: racing-game-frontend
              dockerfile: 'client/Dockerfile.motion'
              containerRegistry: '$(acrName)'
              arguments: |
                --build-arg REACT_APP_API_URL=$(REACT_APP_API_URL)
                --build-arg REACT_APP_WS_URL=$(REACT_APP_WS_URL)
              tags: |
                motion-$(Build.BuildId)
                motion-latest

          - task: Docker@2
            displayName: 'Push MOTION Image'
            inputs:
              command: push
              repository: racing-game-frontend
              containerRegistry: '$(acrName)'
              tags: |
                motion-$(Build.BuildId)
                motion-latest

  - stage: DeployCanary
    displayName: 'Deploy Canary (80/20)'
    dependsOn: BuildVersions
    condition: succeeded()
    jobs:
      - deployment: DeployCanaryRelease
        displayName: 'Deploy with Traffic Split'
        environment: 'Production-Canary'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Backend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name racing-game-backend \
                        --resource-group $(resourceGroup) \
                        --image $(acrName).azurecr.io/racing-game-backend:latest \
                        --set-env-vars \
                          NODE_ENV=development \
                          PORT=3001 \
                          JWT_SECRET=$(JWT_SECRET) \
                          CORS_ORIGIN=$(CORS_ORIGIN_DEV)                     
                - task: AzureCLI@2
                  displayName: 'Deploy Version TAP'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(appName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrName).azurecr.io/racing-game-frontend:tap-canary-$(Build.BuildId) \
                        --revision-suffix tap-canary-$(Build.BuildId)

                - task: AzureCLI@2
                  displayName: 'Get Current Stable Revision'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      STABLE_REV=$(az containerapp revision list \
                        --name $(appName) \
                        --resource-group $(resourceGroup) \
                        --query "[?contains(name, 'tap')].name | [0]" \
                        --output tsv)          
                      echo "##vso[task.setvariable variable=stableRevision]$STABLE_REV"     

                - task: AzureCLI@2
                  displayName: 'Deploy MOTION as Canary'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(appName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrName).azurecr.io/racing-game-frontend:motion-$(Build.BuildId) \
                        --revision-suffix motion-$(Build.BuildId)

                - task: AzureCLI@2
                  displayName: 'Configure Traffic Split (80/20)'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      CANARY_REV=$(az containerapp revision list \
                        --name $(appName) \
                        --resource-group $(resourceGroup) \
                        --query "[0].name" \
                        --output tsv)
                      
                      az containerapp ingress traffic set \
                        --name $(appName) \
                        --resource-group $(resourceGroup) \
                        --revision-weight \
                          $(stableRevision)=80 \
                          $CANARY_REV=20
                      
                      echo "✅ Canary deployed with 20% traffic"


resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/feature/tap