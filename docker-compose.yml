version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    networks:
      - racing-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:3001
        - REACT_APP_WS_URL=http://localhost:3001
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - racing-network
    restart: unless-stopped
networks:
  racing-network:
    driver: bridge

volumes:
  mongo-data: