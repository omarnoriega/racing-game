# Azure DevOps Pipeline - Racing Game
# CI/CD para Azure Container Apps

trigger:
  branches:
    include:
      - main
      - develop
      - feature/tap
pr:
  branches:
    include:
      - main
      - develop

variables:
  # Azure Container Registry
  - name: acrName
    value: 'racinggamecr' 
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'
  
  # Azure Container Apps
  - name: resourceGroup
    value: 'racing-game-rg' 
  - name: containerAppEnvironment
    value: 'racing-game-env' 
  - name: backendAppName
    value: 'racing-game-backend'
  - name: frontendAppName
    value: 'racing-game-frontend'
  
  # Docker Images
  - name: backendImageName
    value: 'racing-game-backend'
  - name: frontendImageName
    value: 'racing-game-frontend'
  - name: imageTag
    value: '$(Build.BuildId)'
  
  # Azure Subscription
  - name: azureSubscription
    value: 'Azure-Racing-Game' 

  # Configuración
  - group: 'racing-game-config' 

  - name: appName
    value: 'racing-game-frontend'
  - name: keepRevisions
    value: 1
  - name: backendApp
    value: 'racing-game-backend'
  - name: frontendApp
    value: 'racing-game-frontend'

stages:
  # Stage 1: Limpieza Pre-Deploy
  - stage: PreCleanup
    displayName: 'Pre-Deploy Cleanup'
    jobs:
        - job: CleanupOldRevisions
          displayName: 'Cleanup Old Revisions'
          pool:
            vmImage: 'ubuntu-latest'
          steps:
            - task: AzureCLI@2
              displayName: 'Cleanup Backend Revisions'
              inputs:
                azureSubscription: '$(azureSubscription)'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  echo "🧹 Cleaning up old backend revisions..."
                  
                  # Obtener revisiones (ordenadas, más reciente primero)
                  REVISIONS=$(az containerapp revision list \
                    --name $(backendApp) \
                    --resource-group $(resourceGroup) \
                    --query "sort_by([].{name:name, created:properties.createdTime}, &created) | reverse(@) | [].name" \
                    --output tsv)
                  
                  # Contar revisiones
                  TOTAL=$(echo "$REVISIONS" | wc -l)
                  echo "Total revisions: $TOTAL"
                  
                  # Si hay más revisiones que las que queremos mantener
                  if [ $TOTAL -gt $(keepRevisions) ]; then
                    # Obtener revisiones a eliminar (todas excepto las últimas N)
                    TO_DELETE=$(echo "$REVISIONS" | tail -n +$(($(keepRevisions) + 1)))
                    
                    for REV in $TO_DELETE; do
                      echo "Deactivating: $REV"
                      az containerapp revision deactivate \
                        --name $(backendApp) \
                        --resource-group $(resourceGroup) \
                        --revision $REV \
                        --output none || true
                    done
                    
                    echo "✅ Cleanup completed"
                  else
                    echo "✅ No cleanup needed"
                  fi

            - task: AzureCLI@2
              displayName: 'Cleanup Frontend Revisions'
              inputs:
                azureSubscription: '$(azureSubscription)'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  echo "🧹 Cleaning up old frontend revisions..."
                  
                  REVISIONS=$(az containerapp revision list \
                    --name $(frontendApp) \
                    --resource-group $(resourceGroup) \
                    --query "sort_by([].{name:name, created:properties.createdTime}, &created) | reverse(@) | [].name" \
                    --output tsv)
                  
                  TOTAL=$(echo "$REVISIONS" | wc -l)
                  echo "Total revisions: $TOTAL"
                  
                  if [ $TOTAL -gt $(keepRevisions) ]; then
                    TO_DELETE=$(echo "$REVISIONS" | tail -n +$(($(keepRevisions) + 1)))
                    
                    for REV in $TO_DELETE; do
                      echo "Deactivating: $REV"
                      az containerapp revision deactivate \
                        --name $(frontendApp) \
                        --resource-group $(resourceGroup) \
                        --revision $REV \
                        --output none || true
                    done
                    
                    echo "✅ Cleanup completed"
                  else
                    echo "✅ No cleanup needed"
                  fi
  - stage: Build
    displayName: 'Build and Push Docker Images'
    jobs:
      - job: BuildBackend
        displayName: 'Build Backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: '$(acrName)'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              repository: $(backendImageName)
              dockerfile: 'server/Dockerfile'
              containerRegistry: '$(acrName)'
              tags: |
                tap-$(imageTag)
                tap-latest

          - task: Docker@2
            displayName: 'Push Backend Image'
            inputs:
              command: push
              repository: $(backendImageName)
              containerRegistry: '$(acrName)'
              tags: |
                tap-$(imageTag)
                tap-latest

      - job: BuildFrontend
        displayName: 'Build Frontend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: '$(acrName)'

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              repository: $(frontendImageName)
              dockerfile: 'client/Dockerfile'
              containerRegistry: '$(acrName)'
              arguments: |
                --build-arg REACT_APP_API_URL=$(REACT_APP_API_URL)
                --build-arg REACT_APP_WS_URL=$(REACT_APP_WS_URL)
              tags: |
                tap-$(imageTag)
                tap-latest

          - task: Docker@2
            displayName: 'Push Frontend Image'
            inputs:
              command: push
              repository: $(frontendImageName)
              containerRegistry: '$(acrName)'
              tags: |
                tap-$(imageTag)
                tap-latest

  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Dev Environment'
        environment: 'Development'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Backend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(backendAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrLoginServer)/$(backendImageName):tap-$(imageTag) \
                        --revision-suffix tap-$(imageTag) \
                        --set-env-vars \
                          NODE_ENV=development \
                          PORT=3001 \
                          JWT_SECRET=$(JWT_SECRET) \
                          CORS_ORIGIN=$(CORS_ORIGIN_DEV)

                - task: AzureCLI@2
                  displayName: 'Deploy Frontend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(frontendAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrLoginServer)/$(frontendImageName):tap-$(imageTag) \
                        --revision-suffix tap-$(imageTag)
                      
                      az containerapp traffic set \
                        --name $(frontendAppName) \
                        --resource-group $(resourceGroup) \
                        --revision-weight $(frontendAppName)-tap-$(imageTag) >=100
                   
                      echo "✅ Version deployed with 100% traffic"          