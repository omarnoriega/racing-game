# Azure DevOps Pipeline - Racing Game
# CI/CD para Azure Container Apps

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - client/*
      - server/*
      - shared/*
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - develop

variables:
  # Azure Container Registry
  - name: acrName
    value: 'racinggameacr' # TODO: Nombre de tu ACR (ej: racinggameacr)
  - name: acrLoginServer
    value: '$(acrName).azurecr.io'
  
  # Azure Container Apps
  - name: resourceGroup
    value: 'racing-game-rg' # TODO: Nombre del resource group
  - name: containerAppEnvironment
    value: 'racing-game-env' # TODO: Nombre del environment
  - name: backendAppName
    value: 'racing-game-backend'
  - name: frontendAppName
    value: 'racing-game-frontend'
  
  # Docker Images
  - name: backendImageName
    value: 'racing-game-backend'
  - name: frontendImageName
    value: 'racing-game-frontend'
  - name: imageTag
    value: '$(Build.BuildId)'
  
  # Azure Subscription
  - name: azureSubscription
    value: 'Azure-Racing-Game' # TODO: Nombre de tu service connection

  # Configuración
  - group: 'racing-game-config' # Variable group en Azure DevOps

stages:
  - stage: Build
    displayName: 'Build and Push Docker Images'
    jobs:
      - job: BuildBackend
        displayName: 'Build Backend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: '$(acrName)'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              repository: $(backendImageName)
              dockerfile: 'server/Dockerfile'
              containerRegistry: '$(acrName)'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Push Backend Image'
            inputs:
              command: push
              repository: $(backendImageName)
              containerRegistry: '$(acrName)'
              tags: |
                $(imageTag)
                latest

      - job: BuildFrontend
        displayName: 'Build Frontend'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: '$(acrName)'

          - task: Docker@2
            displayName: 'Build Frontend Image'
            inputs:
              command: build
              repository: $(frontendImageName)
              dockerfile: 'client/Dockerfile'
              containerRegistry: '$(acrName)'
              arguments: |
                --build-arg REACT_APP_API_URL=$(REACT_APP_API_URL)
                --build-arg REACT_APP_WS_URL=$(REACT_APP_WS_URL)
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Push Frontend Image'
            inputs:
              command: push
              repository: $(frontendImageName)
              containerRegistry: '$(acrName)'
              tags: |
                $(imageTag)
                latest

  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Dev Environment'
        environment: 'Development'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Backend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(backendAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrLoginServer)/$(backendImageName):$(imageTag) \
                        --set-env-vars \
                          NODE_ENV=development \
                          PORT=3001 \
                          MONGODB_URI=$(MONGODB_URI_DEV) \
                          JWT_SECRET=$(JWT_SECRET) \
                          CORS_ORIGIN=$(CORS_ORIGIN_DEV)

                - task: AzureCLI@2
                  displayName: 'Deploy Frontend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(frontendAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrLoginServer)/$(frontendImageName):$(imageTag)

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy to Production'
        environment: 'Production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy Backend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(backendAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrLoginServer)/$(backendImageName):$(imageTag) \
                        --set-env-vars \
                          NODE_ENV=production \
                          PORT=3001 \
                          MONGODB_URI=$(MONGODB_URI_PROD) \
                          JWT_SECRET=$(JWT_SECRET) \
                          CORS_ORIGIN=$(CORS_ORIGIN_PROD)

                - task: AzureCLI@2
                  displayName: 'Deploy Frontend to Container App'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(frontendAppName) \
                        --resource-group $(resourceGroup) \
                        --image $(acrLoginServer)/$(frontendImageName):$(imageTag)

                - task: AzureCLI@2
                  displayName: 'Verify Deployment'
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Checking backend health..."
                      BACKEND_URL=$(az containerapp show \
                        --name $(backendAppName) \
                        --resource-group $(resourceGroup) \
                        --query properties.configuration.ingress.fqdn \
                        -o tsv)
                      
                      curl -f https://$BACKEND_URL/health || exit 1
                      
                      echo "Backend deployed successfully!"