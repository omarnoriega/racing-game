# Configuración de scaling y recursos para Container Apps

properties:
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 3001
      transport: auto
      traffic:
        - latestRevision: true
          weight: 100
      customDomains: []
    
    secrets: []
    
    registries:
      - server: ${ACR_LOGIN_SERVER}
        username: ${ACR_USERNAME}
        passwordSecretRef: acr-password

  template:
    containers:
      - name: backend
        image: ${ACR_LOGIN_SERVER}/racing-game-backend:latest
        resources:
          cpu: 0.5
          memory: 1.0Gi
        env:
          - name: NODE_ENV
            value: production
          - name: PORT
            value: "3001"
          - name: MONGODB_URI
            secretRef: mongodb-uri
          - name: JWT_SECRET
            secretRef: jwt-secret
          - name: CORS_ORIGIN
            value: ${CORS_ORIGIN}
        probes:
          liveness:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readiness:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

    scale:
      minReplicas: 1
      maxReplicas: 10
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "50"